<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0B1815">
<title>Run To Earn</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Thai:wght@400;500;600;700;800&display=swap" media="print" onload="this.media='all'"><noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Thai:wght@400;500;600;700;800&display=swap"></noscript><link rel="dns-prefetch" href="https://tile.openstreetmap.org">
<style>
/* Layout: single phone-width column, scrolling content, fixed 5-tab bar. Light mint single look. */
:root{--card:#FFFFFF;--ink:#0B3B35;--dark:#0F4A41;--dark2:#0A3A33;--green:#1FA971;--green2:#14935F;--mint:#DDF1EA;--mint2:#EAF6F2;--bg:#E6FAF0;--card:#FFFFFF;--muted:#6E8882;--line:#E1F3EB;--bar:#E3EEEA;--navbg:rgba(255,255,255,.97);--pillbg:#CFF0E2;--pilltx:#0F4A41;--strkbg:#FFF1EA;--tb:#0F4A41;--orange:#F26B38;--red:#E5453A;
--f-th:'Noto Sans Thai','Inter',system-ui,sans-serif;--f-en:'Inter','Noto Sans Thai',system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--ink:#E3F2EE;--bg:#0B1815;--card:#12251F;--muted:#8FAAA3;--line:#21403A;--mint:#1B3A31;--mint2:#183229;--bar:#21403A;--navbg:rgba(11,24,21,.94);--pillbg:#1F4A3C;--pilltx:#CFF0E2;--strkbg:#3B2417;--tb:#8FE3C3;--green2:#3FCB92;--dark:#1B6B58;color-scheme:dark}}
:root[data-theme="dark"]{--ink:#E3F2EE;--bg:#0B1815;--card:#12251F;--muted:#8FAAA3;--line:#21403A;--mint:#1B3A31;--mint2:#183229;--bar:#21403A;--navbg:rgba(11,24,21,.94);--pillbg:#1F4A3C;--pilltx:#CFF0E2;--strkbg:#3B2417;--tb:#8FE3C3;--green2:#3FCB92;--dark:#1B6B58;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-th);font-size:14px;line-height:1.35;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:6px}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0;text-align:inherit}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--green);outline-offset:2px}
.app{max-width:430px;margin:0 auto}
main{padding-bottom:96px;display:flex;flex-direction:column;gap:12px}
.ic{flex:none}
.top{display:grid;grid-template-columns:44px 1fr 44px;align-items:center;gap:6px;padding:6px 0 2px}
.ttl{text-align:center;font-family:var(--f-en);font-weight:800;font-size:19px;letter-spacing:.2px;line-height:1.1}
.ttl small{display:block;font-weight:500;font-size:12px;color:var(--muted);letter-spacing:0;margin-top:3px}
.ibtn{width:44px;height:44px;border-radius:50%;background:var(--card);display:grid;place-items:center;box-shadow:0 2px 10px rgba(15,74,65,.08)}
.sp{width:44px}
.bal{display:flex;align-items:center;gap:14px;width:100%;padding:18px;border-radius:22px;color:#fff;background:linear-gradient(135deg,#14584D,#0A3A33);box-shadow:0 8px 20px rgba(10,58,51,.25)}
.bal-t{flex:1;display:flex;flex-direction:column;min-width:0}
.bal-t span{font-size:16px;color:#CFE9E1}
.bal-t b{font-family:var(--f-en);font-size:44px;line-height:1.05;font-weight:700}
.bal-t em{font-style:normal;font-family:var(--f-en);font-size:13px;color:#CFE9E1;letter-spacing:.5px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;display:flex;gap:10px;align-items:flex-start;min-width:0}
.stat .sl{font-size:12px;color:var(--ink)}
.stat .sv{font-family:var(--f-en);font-size:26px;font-weight:700;line-height:1.15;margin-top:2px}
.stat .sv small{font-size:14px;font-weight:700}
.stat .sub{font-size:11px;color:var(--muted)}
.stat .st{min-width:0;flex:1}
.bar{height:9px;border-radius:9px;background:var(--bar);margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#46C393,#1FA971);border-radius:9px}
.go{display:flex;align-items:center;gap:14px;width:100%;padding:14px 18px;border-radius:22px;color:#fff;background:linear-gradient(135deg,#2BB67D,#14935F);box-shadow:0 8px 18px rgba(20,147,95,.3)}
.go div{flex:1}
.go b{display:block;font-family:var(--f-en);font-size:26px;font-weight:600;letter-spacing:.3px}
.go span{font-size:13px}
.hero{display:flex;gap:14px;align-items:center;padding:18px;border-radius:22px;color:#fff;background:linear-gradient(135deg,#14584D,#0A3A33)}
.hero h2{margin:0;font-size:28px;font-weight:700;line-height:1.1}
.hero p{margin:4px 0 0;color:#8FE3C3;font-weight:600;font-size:16px}
.hero small{display:block;margin-top:6px;font-family:var(--f-en);color:#CFE9E1;font-size:12px;line-height:1.3}
.big{font-family:var(--f-en);font-size:32px;font-weight:700}
.cap{font-family:var(--f-en);font-size:10px;color:var(--muted);letter-spacing:.4px;text-transform:uppercase}
.pgt{text-align:center;margin:0}
.pgt h1{margin:0;font-family:var(--f-en);font-size:24px;font-weight:800}
.pgt p{margin:2px 0 0;font-size:13px;font-weight:600}
.wt{display:flex;align-items:center;gap:12px}
.wt h1{margin:0;font-family:var(--f-en);font-size:28px;font-weight:700;line-height:1.1}
.wt p{margin:2px 0 0;font-size:12px;color:var(--ink)}
.wbox{width:56px;height:56px;border-radius:16px;background:var(--dark);color:#fff;display:grid;place-items:center;flex:none}
.xfer{width:78px;align-self:stretch;border-radius:16px;background:var(--mint);color:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-weight:700}
.xfer small{font-family:var(--f-en);font-size:11px;font-weight:500}
.panel{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px}
.ph{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px}
.ph b{font-size:15px}
select{font:inherit;font-size:13px;padding:6px 10px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
.chart{width:100%;height:auto;display:block}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hist{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px 10px;min-width:0}
.hist h3{margin:0 0 8px;font-size:13px;display:flex;align-items:center;gap:6px}
.row{display:flex;align-items:center;gap:8px;padding:7px 0;min-width:0}
.row .rb{width:30px;height:30px;border-radius:50%;background:var(--mint2);display:grid;place-items:center;flex:none}
.row .rt{flex:1;min-width:0;font-size:12px;font-weight:600}
.row .rt small{display:block;font-weight:400;color:var(--muted);font-size:10px}
.row .ra{font-family:var(--f-en);font-weight:700;font-size:12px;white-space:nowrap}
.in{color:var(--green2)}.out{color:var(--red)}
.link{display:flex;align-items:center;justify-content:flex-end;gap:2px;width:100%;font-weight:700;font-size:12px;padding-top:6px}
.search{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:0 14px;height:48px;color:var(--muted)}
.search input{flex:1;min-width:0;border:0;background:none;font:inherit;color:var(--ink);height:100%}
.search input::placeholder{color:var(--muted)}
.cats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.cat{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;font-weight:600}
.cat i{width:56px;height:56px;border-radius:50%;background:var(--mint);display:grid;place-items:center}
.cat small{font-family:var(--f-en);font-weight:400;font-size:11px;color:var(--muted)}
.cat.on i{background:var(--dark);color:#fff}
.sh{display:flex;justify-content:space-between;align-items:center}
.sh b{font-size:17px}
.sh button{color:var(--green2);font-weight:600;font-size:13px;display:flex;align-items:center}
.deal{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:8px 12px 8px 8px}
.thumb{width:84px;height:84px;border-radius:14px;display:grid;place-items:center;color:#fff;flex:none}
.deal .dt{flex:1;min-width:0}
.deal .dt b{display:block;font-family:var(--f-en);font-size:15px}
.deal .dt span{font-size:12px;color:var(--muted)}
.deal .cost{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-top:6px}
.deal .cost em{font-style:normal;font-family:var(--f-en);font-weight:700;font-size:13px;display:flex;align-items:center;gap:5px}
.rbtn{background:var(--green);color:#fff;font-family:var(--f-en);font-weight:700;font-size:12px;padding:8px 14px;border-radius:999px}
.rbtn.dim{background:#9CC9B8}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;background:var(--card);border-radius:16px;padding:5px;border:1px solid var(--line)}
.tab{text-align:center;padding:7px 4px;border-radius:12px;font-weight:700;font-size:15px;line-height:1.1}
.tab small{display:block;font-family:var(--f-en);font-size:12px;font-weight:600;opacity:.8}
.tab.on{background:var(--dark);color:#fff}
.cp{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.cph{display:grid;grid-template-columns:1fr 1fr;height:96px}
.cph .l{display:grid;place-items:center;color:#fff}
.cph .r{background:var(--dark);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-family:var(--f-en);font-weight:700;font-size:20px}
.cph .r small{font-size:8px;font-weight:500;letter-spacing:.8px;line-height:1.1;text-align:center}
.cpb{padding:14px 16px 16px;display:flex;flex-direction:column;gap:6px}
.cpb h3{margin:0;font-size:22px}
.cpb .t2{font-weight:700;color:var(--ink);font-size:15px;line-height:1.3}
.cpb .en{font-family:var(--f-en);font-size:11px;font-weight:600;color:var(--ink)}
.qrw{align-self:center;padding:6px;background:#fff;position:relative}
.qr{width:104px;height:104px;display:grid;place-items:center}
.qr img,.qr canvas{width:104px!important;height:104px!important}
.used .qr{opacity:.2}
.code{align-self:center;background:var(--mint2);border-radius:10px;padding:6px 26px;font-family:var(--f-en);font-weight:700;letter-spacing:.5px}
.cpf{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:6px}
.cpf .ex{display:flex;gap:8px;align-items:center;font-size:12px;font-weight:700;line-height:1.25;min-width:0}
.cpf .ex small{display:block;font-family:var(--f-en);font-weight:500;font-size:11px}
.pill{background:var(--pillbg);color:var(--pilltx);border-radius:14px;padding:8px 14px;display:flex;align-items:center;gap:8px;font-weight:700;font-size:15px;line-height:1.1;text-align:left}
.pill small{display:block;font-family:var(--f-en);font-size:12px;font-weight:600}
.pill.used{background:var(--mint);color:var(--muted)}
.cpact{align-self:flex-end;font-weight:700;font-size:12px;color:var(--green2);padding:4px 0}
.empty{text-align:center;color:var(--muted);padding:28px 10px}
.map{width:100%;height:auto;display:block;border-radius:18px;border:1px solid var(--line)}
.mapw{position:relative}
.badge{position:absolute;left:10px;top:10px;background:var(--dark);color:#fff;display:flex;align-items:center;gap:8px;padding:9px 12px;border-radius:12px;font-weight:700;font-size:14px;line-height:1.1}
.badge small{display:block;font-family:var(--f-en);font-weight:500;font-size:10px;letter-spacing:.5px}
.gps{position:absolute;right:10px;top:10px;color:#0B3B35;background:rgba(255,255,255,.92);border-radius:999px;padding:4px 10px;font-size:11px;display:flex;align-items:center;gap:6px;font-weight:600}
.gps i{width:7px;height:7px;border-radius:50%;background:var(--green)}
.ctl{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;text-align:center;padding:6px 0}
.cb{display:flex;flex-direction:column;align-items:center;gap:6px;font-weight:700;font-size:12px;line-height:1.1}
.cb small{display:block;font-family:var(--f-en);font-size:11px}
.cb i{width:76px;height:76px;border-radius:50%;display:grid;place-items:center;color:#fff;box-shadow:0 6px 14px rgba(0,0,0,.15)}
.cb:disabled{opacity:.4;cursor:default}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--navbg);border-top:1px solid var(--line);padding:6px max(16px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));}
.nav-in{max-width:430px;margin:0 auto;display:grid;grid-template-columns:repeat(6,1fr)}
.nv{display:flex;flex-direction:column;align-items:center;gap:2px;font-family:var(--f-en);font-size:10px;color:var(--muted);font-weight:500;padding:2px 0}
.nv i{width:38px;height:34px;border-radius:50%;display:grid;place-items:center}
.nv.on{color:var(--ink);font-weight:700}
.nv.on i{background:var(--mint)}
.sheetbg{position:fixed;inset:0;background:rgba(5,30,25,.5);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:430px;background:var(--card);border-radius:24px 24px 0 0;padding:20px max(18px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:12px}
.sheet h3{margin:0;font-size:19px}
.sheet p{margin:0;color:var(--muted)}
.fld{display:flex;flex-direction:column;gap:4px;font-weight:600;font-size:13px}
.fld input{font:inherit;font-size:16px;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--mint2);color:var(--ink)}
.err{color:var(--red);font-size:12px;min-height:16px}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.b1,.b2{padding:13px;border-radius:14px;font-weight:700;text-align:center}
.b1{background:var(--green);color:#fff}.b2{background:var(--mint);color:var(--ink)}.b1.red{background:var(--red)}
#toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--dark2);color:#fff;padding:10px 16px;border-radius:999px;z-index:50;max-width:88vw;text-align:center;font-weight:600;font-size:13px;box-shadow:0 6px 18px rgba(0,0,0,.25)}
.prof{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px}
.av{width:64px;height:64px;border-radius:50%;background:var(--dark);color:#fff;display:grid;place-items:center;flex:none}
.kv{display:flex;justify-content:space-between;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}
.kv:last-child{border:0}
.kv b{font-family:var(--f-en)}
.thumb{position:relative}
.hot{position:absolute;left:6px;top:6px;background:var(--orange);color:#fff;font-family:var(--f-en);font-size:9px;font-weight:800;padding:2px 6px;border-radius:999px}
.feat{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x proximity;padding-bottom:4px;-webkit-overflow-scrolling:touch}
.fc{flex:none;width:150px;border-radius:18px;padding:12px;color:#fff;display:flex;flex-direction:column;gap:2px;scroll-snap-align:start;text-align:left}
.fc b{font-family:var(--f-en);font-size:14px;margin-top:8px}.fc span{font-size:11px;opacity:.85}.fc em{font-style:normal;font-family:var(--f-en);font-weight:700;font-size:13px;margin-top:6px}
.deal,.cp,.grp{content-visibility:auto;contain-intrinsic-size:auto 110px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.chip{flex:none;padding:8px 14px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-weight:600;font-size:13px;white-space:nowrap}
.chip.on{background:var(--dark);color:#fff;border-color:var(--dark)}
.grp{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:10px}
.gh{display:flex;gap:12px;align-items:center}
.gi{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;color:#fff;flex:none}
.gh b{font-size:15px;display:block}
.gm{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted)}
.gm span{display:flex;align-items:center;gap:5px}
.ga{display:flex;gap:8px;justify-content:space-between;align-items:center}
.ga .ct{font-size:12px;font-weight:600;display:flex;align-items:center;gap:5px}
.jb{padding:9px 16px;border-radius:999px;font-weight:700;font-size:13px;background:var(--green);color:#fff}
.jb.on{background:var(--mint);color:var(--ink)}
.cki{padding:9px 14px;border-radius:999px;font-weight:700;font-size:12px;background:var(--dark);color:#fff}
.cki:disabled{opacity:.45;cursor:default}
.sel{font:inherit;font-size:16px;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--mint2);color:var(--ink)}
.sheet{max-height:92vh;overflow-y:auto}
button.stat{width:100%;text-align:left}
.strk{display:flex;align-items:center;gap:4px;font-weight:700;font-size:12px;color:var(--orange);background:var(--strkbg);padding:4px 10px;border-radius:999px}
.inf{display:flex;flex-direction:column;gap:1px;margin-top:2px;font-size:11px;font-weight:700}
.lowst{color:var(--red)}
.cd{color:var(--orange);font-family:var(--f-en);font-variant-numeric:tabular-nums}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.m3{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px;display:flex;flex-direction:column;gap:2px;min-width:0}
.m3 span{font-size:11px;color:var(--muted)}
.m3 b{font-family:var(--f-en);font-size:16px}
.stk{display:flex;flex-direction:column;gap:10px}
.evt{color:var(--orange);font-weight:700;font-size:12px}
.jb:disabled{opacity:.5;cursor:default}
.seg{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.kv{align-items:center}
html[lang="en"] .tab small:not(.keep),html[lang="en"] .cat small,html[lang="en"] .cb small,html[lang="en"] .badge small,html[lang="en"] .stat .cap,html[lang="en"] .hero small,html[lang="en"] .xfer small,html[lang="en"] .cpf .ex small,html[lang="en"] .pill small,html[lang="en"] .dup,html[lang="en"] .ttl.dup small,html[lang="en"] .cpb h3,html[lang="en"] .cpb .t2{display:none}
html[lang="en"] .cpb .en{font-size:15px;font-weight:700}
@media (prefers-reduced-motion:no-preference){.rbtn,.go,.bal,.nv i,.tab{transition:transform .12s}.rbtn:active,.go:active,.bal:active{transform:scale(.97)}}

/* ===== v6 modern layer ===== */
:root{--bgtop:#7BE6B8;--sh:0 10px 28px rgba(8,50,42,.10);--sh2:0 8px 22px rgba(10,150,100,.16)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bgtop:#0F3A30}}
:root[data-theme="dark"]{--bgtop:#0F3A30}
body{background:radial-gradient(120% 46% at 50% -8%,var(--bgtop),transparent 70%),var(--bg);background-repeat:no-repeat}
main{padding-bottom:108px;gap:14px}
.ibtn{width:42px;height:42px;border:1px solid var(--line);box-shadow:var(--sh2)}
.ibtn.glass{background:var(--navbg);}
.ttl{font-size:18px;letter-spacing:.6px}
.panel,.stat,.sumc,.m3,.grp,.cp,.search,.hist{border-radius:20px;box-shadow:var(--sh2)}
.bal2{position:relative;display:block;width:100%;overflow:hidden;text-align:left;padding:20px 20px 62px;border-radius:26px;color:#fff;background:radial-gradient(120% 120% at 100% 0,#2A8F77 0,transparent 55%),linear-gradient(140deg,#14584D,#0A3A33);box-shadow:0 14px 30px rgba(10,58,51,.30)}
.bal2::after{content:"";position:absolute;right:-40px;top:-50px;width:170px;height:170px;border-radius:50%;background:rgba(255,255,255,.06)}
.b2c{position:absolute;right:18px;top:16px;z-index:1}

function histHTML(){const runs=[...S.runs].sort((a,b)=>b.t-a.t),t0=new Date();t0.setHours(0,0,0,0);
 const days=[];for(let i=6;i>=0;i--)days.push({d:new Date(t0.getTime()-i*864e5),km:0});

function hav(a,b){const r=Math.PI/180,x=(b.longitude-a.longitude)*r*Math.cos((a.latitude+b.latitude)/2*r),y=(b.latitude-a.latitude)*r;return Math.sqrt(x*x+y*y)*6371000}

 if(R.st!=='running'||!R.last){R.last=c;updRun();return}
 if(c.accuracy>40){return}
 {const d=hav(R.last,c),dt=Math.max(1,(c.timestamp-R.last.timestamp)/1000),thr=Math.max(3,c.accuracy*.6);

 updRun()}

document.addEventListener('click',e=>{const bg=e.target.closest('.sheetbg');if(bg&&e.target===bg){closeSheet();return}
 const el=e.target.closest('[data-act]');if(!el||el.dataset.act==='closeBg')return;const h=ACT[el.dataset.act];if(h)try{h(el.dataset,el)}catch(err){console.error(err);toast('เกิดข้อผิดพลาด ลองอีกครั้ง')}});
let dbT;document.addEventListener('input',e=>{const id=e.target.id;if(id==='q'||id==='gq'){const v=e.target.value;clearTimeout(dbT);dbT=setTimeout(()=>{if(id==='q'){ui.q=v;drawDeals()}else{ui.gq=v;drawGroups()}},120)}});
document.addEventListener('change',e=>{if(e.target.id==='range'){ui.range=+e.target.value;$('#chart').innerHTML=chart()}});
document.addEventListener('visibilitychange',()=>{document.documentElement.classList.toggle('calm',document.hidden);clearInterval(cdT);if(document.hidden)return;calmOff();if(route==='rewards')cdT=setInterval(updCd,1000);{tick();if(R.st==='running')wakeOn();if(route==='run'&&$('#map')){cancelAnimationFrame(mapRaf);mapRaf=requestAnimationFrame(mapLoop)}}});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet()});
document.addEventListener('input',e=>{if(/^pf(Name|First|Last|Phone)$/.test(e.target.id)&&ui.pf){pfSync();if(e.target.id==='pfPhone')e.target.value=ui.pf.phone}});
let tapN=0,tapT=0;document.addEventListener('click',e=>{if(route!=='home'||MODE==='admin'||!e.target.closest('.ttl'))return;const n=Date.now();tapN=n-tapT<1500?tapN+1:1;tapT=n;if(tapN>=7){tapN=0;openPin()}});
